[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "comprehension-bench"
version = "0.1.0"
description = "Measure understanding with transparent experiments."
requires-python = ">=3.11"
authors = [{name = "Anuj Sadani"}]
readme = "README.md"
license = {text = "Proprietary"}
dependencies = []

[project.scripts]
comprehension-bench = "comprehension_bench.__main__:main"

[tool.setuptools.packages.find]
include = ["comprehension_bench*"]

[tool.setuptools.package-data]
"*" = ["web/*.css", "web/*.js", "assets/*.css", "assets/*.js", "*.css", "*.js", "*.json"]
